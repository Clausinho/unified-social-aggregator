name: "Security Scanning"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

jobs:
  npm-audit-backend:
    name: NPM Audit - Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: packages/backend/yarn.lock

    - name: Install dependencies
      working-directory: packages/backend
      run: yarn install --frozen-lockfile

    - name: Run npm audit
      working-directory: packages/backend
      run: |
        yarn audit --level moderate || true
        yarn audit --json > audit-backend.json || true

    - name: Upload audit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: npm-audit-backend
        path: packages/backend/audit-backend.json

  npm-audit-frontend:
    name: NPM Audit - Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.4.1

    - name: Install dependencies
      working-directory: packages/frontend
      run: pnpm install --frozen-lockfile

    - name: Run pnpm audit
      working-directory: packages/frontend
      run: |
        pnpm audit --audit-level moderate || true
        pnpm audit --json > audit-frontend.json || true

    - name: Upload audit results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: npm-audit-frontend
        path: packages/frontend/audit-frontend.json

  trivy-scan:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  secret-scanning:
    name: Secret Scanning with Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GITLEAKS_LICENSE is optional - only needed for Gitleaks Pro features
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
